<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #24292e;
            color: white;
            padding: 40px 20px;
        }
        main {
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        a.btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0366d6;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Swagat Hai!</h1>
        <p>Yeh meri pehli website hai jo GitHub par live hai.</p>
    </header>

    <main>
        <div class="card">
            <h2>Mere Baare Mein</h2>
            <p>Namaste! Main ek developer hoon aur yeh mera GitHub project page hai.</p>
            <a href="https://github.com" target="_blank" class="btn">Mera GitHub Dekhein</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Meri Website. All rights reserved.</p>
    </footer>

</body>
</html>
